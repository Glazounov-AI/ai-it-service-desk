<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI IT Service Desk</title><link rel="stylesheet" href="/ui-assets/style.css"><script defer src="/ui-assets/app.js"></script></head>
<body><main><header><div><h1>AI IT Service Desk</h1><p>Помощник технической поддержки · локальная версия</p></div><span id="status">Нет обращения</span></header><section class="toolbar"><button id="new">Новое обращение</button><button id="refresh">Обновить</button><button id="close">Закрыть обращение</button></section><p class="notice">Не вводите пароли, токены и коды MFA. Заявки не отправляются автоматически.</p><p id="error" role="alert" hidden></p><div class="workspace"><div class="conversation"><section id="chat" aria-label="История обращения" aria-live="polite"></section><form id="form"><label for="query">Опишите проблему</label><textarea id="query" maxlength="2000" rows="3" required placeholder="Например: не запускается VPN-клиент"></textarea><div class="toolbar"><button id="send" type="submit">Отправить</button><span id="waiting" role="status"></span></div></form><div id="quick" class="toolbar" hidden><button data-answer="Выполнил">Выполнил</button><button data-answer="Не помогло">Не помогло</button><button data-answer="Проблема устранена">Проблема устранена</button><button data-answer="Да">Да</button><button data-answer="Нет">Нет</button><button data-answer="Не отображается" hidden>Не отображается</button><button data-answer="Нет информации" hidden>Нет информации</button></div></div><aside aria-label="Диагностическая панель"><section class="panel"><h2>Диагностика</h2><p id="panel-status" role="status">Нет обращения</p><div id="diagnostic"></div></section><section class="panel"><h2>Черновик заявки</h2><div id="draft"></div><button id="copy-draft" disabled>Копировать черновик</button><p id="copy-status" role="status"></p></section></aside></div><footer>Glazounov AI Lab · AI IT Service Desk</footer></main></body></html>
